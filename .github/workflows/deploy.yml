name: Build, Push and Deploy to EC2

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/hr-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/hr-frontend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/hr-frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/hr-frontend:buildcache,mode=max

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            set -e

            APP_DIR=/home/${{ secrets.EC2_USERNAME }}/hr_fr

            mkdir -p $APP_DIR
            cd $APP_DIR

            echo "Downloading compose file..."
            curl -fsSL \
              https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/docker-compose.prod.yml \
              -o docker-compose.prod.yml

            echo "Pulling latest image..."
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/hr-frontend:latest

            echo "Stopping old containers..."
            sudo docker compose -f docker-compose.prod.yml down

            echo "Starting new containers..."
            sudo docker compose -f docker-compose.prod.yml up -d

            echo "Cleaning unused images..."
            sudo docker image prune -af

            echo "Running containers:"
            sudo docker ps

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            sleep 10

            sudo docker ps

            if sudo docker ps | grep -q hr_frontend_prod; then
              echo "Deployment completed successfully!"
            else
              echo "Container is not running!"
              exit 1
            fi
